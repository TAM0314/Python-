<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>的中ナビ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>

<!-- グラフ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--font-family:'Noto Sans JP',sans-serif;
--bg:#f8fafc;
--text:#111;
--accent:#4f46e5;
}
:root[data-theme="dark"]{--bg:#1e293b;--text:#fff;}
:root[data-theme="sakura"]{--bg:#fff0f5;--text:#5d4037;}
:root[data-theme="mono"]{--bg:#fff;--text:#000;}

body{margin:0;font-family:var(--font-family);background:var(--bg);color:var(--text);}
.container{padding:20px;max-width:800px;margin:auto;}
.header{display:flex;justify-content:space-between;}
.btn{background:var(--accent);color:white;border:none;padding:10px;border-radius:10px;cursor:pointer;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px;}
.cell{padding:20px;background:#e5e7eb;text-align:center;border-radius:12px;cursor:pointer;}
.hit{background:#10b981;color:white;}
.miss{background:#ef4444;color:white;}

.stats{margin-top:10px;font-size:18px;}

.history{margin-top:20px;}
.record{background:white;padding:10px;border-radius:8px;margin-top:5px;}

canvas{margin-top:20px;}

.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;justify-content:center;align-items:center;
}
.modal-content{background:white;padding:20px;border-radius:12px;}

#app-loading{
position:fixed;width:100%;height:100%;
display:flex;justify-content:center;align-items:center;
background:white;z-index:9999;
}
#app-loading.hidden{
opacity:0;visibility:hidden;transition:0.8s;
}
</style>

<script>
let current=[];
let history=[];
let chart;

function init(){
document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';
history=JSON.parse(localStorage.getItem('history')||'[]');
newSession();
renderHistory();
renderChart();

setTimeout(()=>document.getElementById('app-loading').classList.add('hidden'),800);
}

function newSession(){
current=Array(8).fill(null);
render();
}

function toggle(i){
if(!current[i]) current[i]='hit';
else if(current[i]=='hit') current[i]='miss';
else current[i]=null;
render();
}

function render(){
const grid=document.getElementById('grid');
grid.innerHTML='';
current.forEach((s,i)=>{
let d=document.createElement('div');
d.className='cell '+(s||'');
d.innerText=i+1;
d.onclick=()=>toggle(i);
grid.appendChild(d);
});
updateStats();
}

function updateStats(){
const hit=current.filter(x=>x=='hit').length;
const total=current.filter(x=>x).length;
const rate=total?Math.round(hit/total*100):0;
document.getElementById('stats').innerText=`的中:${hit} / 射数:${total} / 的中率:${rate}%`;
}

function saveSession(){
const hit=current.filter(x=>x=='hit').length;
const total=current.filter(x=>x).length;
if(total==0){alert('記録がありません');return;}

history.unshift({
date:new Date().toLocaleTimeString(),
hit,total
});

localStorage.setItem('history',JSON.stringify(history));

newSession();
renderHistory();
renderChart();
}

function renderHistory(){
const el=document.getElementById('history');
el.innerHTML='';
history.forEach(r=>{
const rate=Math.round(r.hit/r.total*100);
const div=document.createElement('div');
div.className='record';
div.innerText=`${r.date}｜${r.hit}/${r.total}（${rate}%）`;
el.appendChild(div);
});
}

function renderChart(){
const ctx=document.getElementById('chart').getContext('2d');

const labels = history.map(h=>h.date).reverse();
const data = history.map(h=>Math.round(h.hit/h.total*100)).reverse();

// 平均値計算
const avg = data.length 
  ? Math.round(data.reduce((a,b)=>a+b,0)/data.length) 
  : 0;

// 平均ライン用データ
const avgLine = new Array(data.length).fill(avg);

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'line',
data:{
labels,
datasets:[
{
label:'的中率',
data,
borderColor:'#4f46e5',
tension:0.3
},
{
label:'平均',
data:avgLine,
borderColor:'#ef4444',
borderDash:[5,5], // 点線
tension:0,
pointRadius:0
}
]
},
options:{
responsive:true,
plugins:{
legend:{display:true}
},
scales:{
y:{
min:0,
max:100,
ticks:{
callback:(v)=>v+'%'
}
}
}
}
});
}

function setTheme(t){
document.documentElement.dataset.theme=t;
localStorage.setItem('theme',t);
}

function openSettings(){
document.getElementById('modal').style.display='flex';
}
function closeModal(){
document.getElementById('modal').style.display='none';
}

window.onclick=function(e){
if(e.target.classList.contains('modal')) e.target.style.display='none';
}

document.addEventListener('DOMContentLoaded',init);
function clearHistory(){
  if(!confirm('本当に履歴をすべて削除しますか？')) return;

  history = [];
  localStorage.removeItem('history');

  renderHistory();
  renderChart();
}
``
</script>
</head>

<body>

<div id="app-loading">🏹 的中ナビ</div>

<div class="container">

<div class="header">
<div>🏹 的中ナビ</div>
<div>
<button onclick="openSettings()">設定</button>
</div>
</div>

<div id="grid" class="grid"></div>
<div id="stats" class="stats"></div>

<button class="btn" onclick="saveSession()">記録保存</button>
<button class="btn" onclick="newSession()">リセット</button>

<canvas id="chart"></canvas>
<button class="btn" onclick="clearHistory()" style="background:#ef4444;">
履歴を全て削除
</button>
<div class="history">
<h3>履歴</h3>
<div id="history"></div>
</div>

</div>

<div id="modal" class="modal">
<div class="modal-content">
<h3>設定</h3>
<button onclick="setTheme('light')">ライト</button>
<button onclick="setTheme('dark')">ダーク</button>
<button onclick="setTheme('sakura')">サクラ</button>
<button onclick="setTheme('mono')">モノクロ</button>
<br><br>
<button onclick="closeModal()">閉じる</button>
</div>
</div>

<footer style="text-align:center;margin-top:20px;">
© 的中ナビ | Developed by Nagata Masayuki
</footer>

</body>
</html>
